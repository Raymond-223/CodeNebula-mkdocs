site_name: CodeNebula
site_description: 面向智能系统研究与工程实践的知识地图，从数学原理走向真实系统。
site_url: https://raymond-223.github.io/CodeNebula-mkdocs/
theme:
  name: material
  language: en
  font: false
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  features:
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.progress
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.expand
  - navigation.path
  - navigation.indexes
  - navigation.top
  - toc.follow
  - search.suggest
  - search.highlight
nav:
- Home: index.md
- Foundations:
  - Mathematics:
    - Overview: mathematics/index.md
    - Linear Algebra & Calculus: mathematics/01-linear-algebra-calculus.md
    - Numerical Computation: mathematics/02-numerical-computation.md
    - Probability & Random Variables: mathematics/03-probability-random-variables.md
    - Conditional Probability & Bayes: mathematics/04-conditional-bayes.md
    - Markov Processes: mathematics/05-markov-processes.md
    - Optimization, Constraints & Uncertainty: mathematics/06-optimization-under-uncertainty.md
  - Control Theory:
    - Overview: control-theory/index.md
    - Dynamic Models & State Space: control-theory/01-modeling-state-space.md
    - Feedback & Stability: control-theory/02-feedback-stability.md
    - PID Principles: control-theory/03-pid.md
    - Optimal Control & LQR: control-theory/04-lqr.md
    - Model Predictive Control: control-theory/05-mpc.md
- Decision & Learning:
  - Reinforcement Learning:
    - Overview: reinforcement-learning/index.md
    - MDP & Bellman Equation: reinforcement-learning/01-mdp-bellman.md
    - Value-Based Methods: reinforcement-learning/02-value-based.md
    - Policy Gradient & Actor–Critic: reinforcement-learning/03-policy-actor-critic.md
    - Exploration & Partial Observability: reinforcement-learning/04-exploration-pomdp.md
    - Model-Based vs Model-Free RL: reinforcement-learning/05-model-based-vs-model-free.md
    - Safe, Robust & Offline RL: reinforcement-learning/06-safe-robust-offline.md
  - Game Theory:
    - Overview: game-theory/index.md
    - Game Models & Classification: game-theory/01-game-models.md
    - Best Response & Nash Equilibrium: game-theory/02-best-response-nash.md
    - Zero-Sum Games & Minimax: game-theory/03-zero-sum-minimax.md
    - Sequential & Bayesian Games: game-theory/04-sequential-bayesian.md
    - Repeated Games & Learning: game-theory/05-repeated-learning.md
  - Multi-Agent Systems:
    - Overview: multi-agent-systems/index.md
    - Agents & System Architectures: multi-agent-systems/01-agents-architectures.md
    - Cooperation, Competition & Coordination: multi-agent-systems/02-coordination.md
    - Communication & Information Sharing: multi-agent-systems/03-communication.md
    - Task Allocation & Distributed Decision Making: multi-agent-systems/04-allocation-distributed-decision.md
    - Multi-Agent Learning & CTDE: multi-agent-systems/05-multi-agent-learning.md
- Robotics & Perception:
  - Robotics:
    - Overview: robotics/index.md
    - Models, Kinematics & Dynamics: robotics/01-models-kinematics-dynamics.md
    - Sensing & State Estimation: robotics/02-sensing-estimation.md
    - Mapping & SLAM: robotics/03-mapping-slam.md
    - Path & Motion Planning: robotics/04-path-motion-planning.md
    - Navigation & Control: robotics/05-navigation-control.md
  - Perception:
    - Overview: perception/index.md
    - Image & Camera Basics: perception/01-image-camera-basics.md
    - Feature-Based Vision: perception/02-feature-vision.md
    - Detection & Segmentation: perception/03-detection-segmentation.md
    - Depth, 3D Vision & Point Clouds: perception/04-depth-point-cloud.md
    - Multi-Modal Perception: perception/05-multimodal.md
- Systems & Simulation:
  - Distributed Systems:
    - Overview: distributed-systems/index.md
    - Networks & Message Passing: distributed-systems/01-network-messaging.md
    - Time & Asynchrony: distributed-systems/02-distributed-time.md
    - Consistency & Distributed State: distributed-systems/03-consistency-state.md
    - Fault Tolerance: distributed-systems/04-fault-tolerance.md
    - DDS & ROS2: distributed-systems/05-middleware-ros2-dds.md
  - Software Engineering:
    - Overview: software-engineering/index.md
    - Requirements & Architecture: software-engineering/01-requirements-architecture.md
    - Modular Design & APIs: software-engineering/02-modular-apis.md
    - Git Workflow: software-engineering/03-version-control.md
    - pytest & Debugging: software-engineering/04-testing-debugging.md
    - Docker, CI & Reliability: software-engineering/05-deployment-reliability.md
  - Simulation & Sim2Real:
    - Overview: simulation-sim2real/index.md
    - Modeling & Physics Simulation: simulation-sim2real/01-modeling-physics.md
    - Robot & Sensor Simulation: simulation-sim2real/02-robot-sensor-simulation.md
    - Reality Gap & Domain Randomization: simulation-sim2real/03-reality-gap-randomization.md
    - Sim2Real & Real2Sim: simulation-sim2real/04-sim2real-real2sim.md
- Safety & Human Factors:
  - Robustness & Safety:
    - Overview: robustness-safety/index.md
    - Uncertainty & Distribution Shift: robustness-safety/01-uncertainty-shift.md
    - Robustness, Risk & Reliability: robustness-safety/02-robustness-risk.md
    - Safety Constraints: robustness-safety/03-safety-constraints.md
    - Fault Detection & Tolerance: robustness-safety/04-fault-tolerance.md
    - Safe Learning & Runtime Safety: robustness-safety/05-safe-learning-runtime.md
  - Human–AI Interaction:
    - Overview: human-ai-interaction/index.md
    - Interaction & Levels of Automation: human-ai-interaction/01-human-ai-automation.md
    - Human-in-the-Loop: human-ai-interaction/02-human-in-loop.md
    - Shared Autonomy: human-ai-interaction/03-shared-autonomy.md
    - Trust & Explainability: human-ai-interaction/04-trust-explainability.md
    - Intervention & Takeover: human-ai-interaction/05-intervention-takeover.md
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- pymdownx.details
- pymdownx.superfences
- pymdownx.emoji
- pymdownx.arithmatex:
    generic: true
extra_css:
- stylesheets/extra.css
- css/custom.css
extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
plugins:
- search:
    lang:
    - zh
    - en
strict: true
