site_name: CodeNebula
site_description: 面向智能系统研究与工程实践的知识地图，从数学原理走向真实系统。
site_url: https://raymond-223.github.io/CodeNebula-mkdocs/
theme:
  name: material
  language: en
  font: false
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  features:
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.progress
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.expand
  - navigation.path
  - navigation.indexes
  - navigation.top
  - toc.follow
  - search.suggest
  - search.highlight
nav:
- 首页: index.md
- 数学基础:
  - 数学总览: mathematics/index.md
  - 线性代数与微积分: mathematics/01-linear-algebra-calculus.md
  - 数值计算: mathematics/02-numerical-computation.md
  - 概率与随机变量: mathematics/03-probability-random-variables.md
  - 条件概率与 Bayes: mathematics/04-conditional-bayes.md
  - Markov 过程: mathematics/05-markov-processes.md
  - 优化、约束与不确定性: mathematics/06-optimization-under-uncertainty.md
- 理论方法:
  - 博弈论:
    - 总览: game-theory/index.md
    - 博弈模型与分类: game-theory/01-game-models.md
    - 最佳响应与 Nash 均衡: game-theory/02-best-response-nash.md
    - 零和与 Minimax: game-theory/03-zero-sum-minimax.md
    - 序贯与 Bayesian 博弈: game-theory/04-sequential-bayesian.md
    - 重复博弈与学习: game-theory/05-repeated-learning.md
  - 多智能体系统:
    - 总览: multi-agent-systems/index.md
    - Agent 与系统架构: multi-agent-systems/01-agents-architectures.md
    - 合作、竞争与协调: multi-agent-systems/02-coordination.md
    - 通信与信息共享: multi-agent-systems/03-communication.md
    - 任务分配与分布式决策: multi-agent-systems/04-allocation-distributed-decision.md
    - 多智能体学习与 CTDE: multi-agent-systems/05-multi-agent-learning.md
  - 控制理论:
    - 总览: control-theory/index.md
    - 动态模型与状态空间: control-theory/01-modeling-state-space.md
    - 反馈与稳定性: control-theory/02-feedback-stability.md
    - PID 原理: control-theory/03-pid.md
    - 最优控制 LQR: control-theory/04-lqr.md
    - 模型预测控制 MPC: control-theory/05-mpc.md
- 算法理解:
  - 强化学习:
    - 总览: reinforcement-learning/index.md
    - MDP 与 Bellman 方程: reinforcement-learning/01-mdp-bellman.md
    - 价值方法: reinforcement-learning/02-value-based.md
    - 策略梯度与 Actor–Critic: reinforcement-learning/03-policy-actor-critic.md
    - 探索与部分可观测: reinforcement-learning/04-exploration-pomdp.md
    - Model-Based 与 Model-Free: reinforcement-learning/05-model-based-vs-model-free.md
    - 安全、鲁棒与离线 RL: reinforcement-learning/06-safe-robust-offline.md
- 工程实现:
  - 机器人学:
    - 总览: robotics/index.md
    - 模型、运动学与动力学: robotics/01-models-kinematics-dynamics.md
    - 传感与状态估计: robotics/02-sensing-estimation.md
    - 建图与 SLAM: robotics/03-mapping-slam.md
    - 路径与运动规划: robotics/04-path-motion-planning.md
    - 导航与控制: robotics/05-navigation-control.md
  - 感知:
    - 总览: perception/index.md
    - 图像与相机基础: perception/01-image-camera-basics.md
    - 特征视觉: perception/02-feature-vision.md
    - 检测与分割: perception/03-detection-segmentation.md
    - 深度、三维视觉与点云: perception/04-depth-point-cloud.md
    - 多模态感知: perception/05-multimodal.md
  - 分布式系统:
    - 总览: distributed-systems/index.md
    - 网络与消息传递: distributed-systems/01-network-messaging.md
    - 时间与异步: distributed-systems/02-distributed-time.md
    - 一致性与分布式状态: distributed-systems/03-consistency-state.md
    - 容错: distributed-systems/04-fault-tolerance.md
    - DDS 与 ROS2: distributed-systems/05-middleware-ros2-dds.md
  - 软件工程:
    - 总览: software-engineering/index.md
    - 需求与架构: software-engineering/01-requirements-architecture.md
    - 模块与 API: software-engineering/02-modular-apis.md
    - Git 工作流: software-engineering/03-version-control.md
    - pytest 与调试: software-engineering/04-testing-debugging.md
    - Docker、CI 与可靠性: software-engineering/05-deployment-reliability.md
- 真实系统:
  - 仿真与 Sim2Real:
    - 总览: simulation-sim2real/index.md
    - 建模与物理仿真: simulation-sim2real/01-modeling-physics.md
    - 机器人与传感器仿真: simulation-sim2real/02-robot-sensor-simulation.md
    - Reality Gap 与域随机化: simulation-sim2real/03-reality-gap-randomization.md
    - Sim2Real 与 Real2Sim: simulation-sim2real/04-sim2real-real2sim.md
  - 鲁棒与安全:
    - 总览: robustness-safety/index.md
    - 不确定性与分布漂移: robustness-safety/01-uncertainty-shift.md
    - 鲁棒性、风险与可靠性: robustness-safety/02-robustness-risk.md
    - 安全约束: robustness-safety/03-safety-constraints.md
    - 故障检测与容错: robustness-safety/04-fault-tolerance.md
    - 安全学习与运行时保护: robustness-safety/05-safe-learning-runtime.md
  - 人机协作:
    - 总览: human-ai-interaction/index.md
    - 人机交互与自动化等级: human-ai-interaction/01-human-ai-automation.md
    - Human-in-the-Loop: human-ai-interaction/02-human-in-loop.md
    - 共享自治: human-ai-interaction/03-shared-autonomy.md
    - 信任与可解释性: human-ai-interaction/04-trust-explainability.md
    - 干预与接管: human-ai-interaction/05-intervention-takeover.md
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- pymdownx.details
- pymdownx.superfences
- pymdownx.emoji
- pymdownx.arithmatex:
    generic: true
extra_css:
- stylesheets/extra.css
- css/custom.css
extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
plugins:
- search:
    lang:
    - zh
    - en
strict: true
