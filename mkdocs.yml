site_name: CodeNebula
site_description: 面向智能系统研究与工程实践的知识地图，从数学原理走向真实系统。
site_url: https://raymond-223.github.io/CodeNebula-mkdocs/
theme:
  name: material
  language: en
  font: false
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  features:
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.progress
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.expand
  - navigation.path
  - navigation.indexes
  - navigation.top
  - toc.follow
  - search.suggest
  - search.highlight
nav:
- Home: index.md
- Foundations:
  - Mathematics:
    - Overview: foundations/mathematics/index.md
    - Linear Algebra & Calculus: foundations/mathematics/01-linear-algebra-calculus.md
    - Numerical Computation: foundations/mathematics/02-numerical-computation.md
    - Probability & Random Variables: foundations/mathematics/03-probability-random-variables.md
    - Conditional Probability & Bayes: foundations/mathematics/04-conditional-bayes.md
    - Markov Processes: foundations/mathematics/05-markov-processes.md
    - Optimization, Constraints & Uncertainty: foundations/mathematics/06-optimization-under-uncertainty.md
  - Control Theory:
    - Overview: foundations/control-theory/index.md
    - Dynamic Models & State Space: foundations/control-theory/01-modeling-state-space.md
    - Feedback & Stability: foundations/control-theory/02-feedback-stability.md
    - PID Principles: foundations/control-theory/03-pid.md
    - Optimal Control & LQR: foundations/control-theory/04-lqr.md
    - Model Predictive Control: foundations/control-theory/05-mpc.md
- Decision & Learning:
  - Reinforcement Learning:
    - Overview: decision-learning/reinforcement-learning/index.md
    - MDP & Bellman Equation: decision-learning/reinforcement-learning/01-mdp-bellman.md
    - Value-Based Methods: decision-learning/reinforcement-learning/02-value-based.md
    - Policy Gradient & Actor–Critic: decision-learning/reinforcement-learning/03-policy-actor-critic.md
    - Exploration & Partial Observability: decision-learning/reinforcement-learning/04-exploration-pomdp.md
    - Model-Based vs Model-Free RL: decision-learning/reinforcement-learning/05-model-based-vs-model-free.md
    - Safe, Robust & Offline RL: decision-learning/reinforcement-learning/06-safe-robust-offline.md
  - Game Theory:
    - Overview: decision-learning/game-theory/index.md
    - Game Models & Classification: decision-learning/game-theory/01-game-models.md
    - Best Response & Nash Equilibrium: decision-learning/game-theory/02-best-response-nash.md
    - Zero-Sum Games & Minimax: decision-learning/game-theory/03-zero-sum-minimax.md
    - Sequential & Bayesian Games: decision-learning/game-theory/04-sequential-bayesian.md
    - Repeated Games & Learning: decision-learning/game-theory/05-repeated-learning.md
  - Multi-Agent Systems:
    - Overview: decision-learning/multi-agent-systems/index.md
    - Agents & System Architectures: decision-learning/multi-agent-systems/01-agents-architectures.md
    - Cooperation, Competition & Coordination: decision-learning/multi-agent-systems/02-coordination.md
    - Communication & Information Sharing: decision-learning/multi-agent-systems/03-communication.md
    - Task Allocation & Distributed Decision Making: decision-learning/multi-agent-systems/04-allocation-distributed-decision.md
    - Multi-Agent Learning & CTDE: decision-learning/multi-agent-systems/05-multi-agent-learning.md
- Robotics & Perception:
  - Robotics:
    - Overview: robotics-perception/robotics/index.md
    - Models, Kinematics & Dynamics: robotics-perception/robotics/01-models-kinematics-dynamics.md
    - Sensing & State Estimation: robotics-perception/robotics/02-sensing-estimation.md
    - Mapping & SLAM: robotics-perception/robotics/03-mapping-slam.md
    - Path & Motion Planning: robotics-perception/robotics/04-path-motion-planning.md
