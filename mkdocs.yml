    - Reality Gap & Domain Randomization: systems-simulation/simulation-sim2real/03-reality-gap-randomization.md
    - Sim2Real & Real2Sim: systems-simulation/simulation-sim2real/04-sim2real-real2sim.md
- Safety & Human Factors:
  - Robustness & Safety:
    - Overview: safety-human-factors/robustness-safety/index.md
    - Uncertainty & Distribution Shift: safety-human-factors/robustness-safety/01-uncertainty-shift.md
    - Robustness, Risk & Reliability: safety-human-factors/robustness-safety/02-robustness-risk.md
    - Safety Constraints: safety-human-factors/robustness-safety/03-safety-constraints.md
    - Fault Detection & Tolerance: safety-human-factors/robustness-safety/04-fault-tolerance.md
    - Safe Learning & Runtime Safety: safety-human-factors/robustness-safety/05-safe-learning-runtime.md
  - Human–AI Interaction:
    - Overview: safety-human-factors/human-ai-interaction/index.md
    - Interaction & Levels of Automation: safety-human-factors/human-ai-interaction/01-human-ai-automation.md
    - Human-in-the-Loop: safety-human-factors/human-ai-interaction/02-human-in-loop.md
    - Shared Autonomy: safety-human-factors/human-ai-interaction/03-shared-autonomy.md
    - Trust & Explainability: safety-human-factors/human-ai-interaction/04-trust-explainability.md
    - Intervention & Takeover: safety-human-factors/human-ai-interaction/05-intervention-takeover.md
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- pymdownx.details
- pymdownx.superfences
- pymdownx.emoji
- pymdownx.arithmatex:
    generic: true
extra_css:
- stylesheets/extra.css
- css/custom.css
extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
plugins:
- search:
    lang:
    - zh
    - en
strict: true
