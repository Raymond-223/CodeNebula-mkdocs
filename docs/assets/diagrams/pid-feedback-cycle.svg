<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="PID feedback loop"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Inter,Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.s{font-size:20px;font-weight:650}.b{font-size:17px}.m{font-size:15px;fill:#5f6b7a}.box{fill:#f4f7fb;stroke:#8aa0b5;stroke-width:2}.accent{fill:#dce8f5;stroke:#8aa0b5;stroke-width:2}.accent2{fill:#e8f1e8;stroke:#8aa0b5;stroke-width:2}.warn{fill:#f7eee1;stroke:#8aa0b5;stroke-width:2}.line{stroke:#8aa0b5;stroke-width:3;fill:none}.arrow{stroke:#8aa0b5;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#8aa0b5;stroke-width:2;stroke-dasharray:8 7;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b5"/></marker></defs><text x="60" y="58" class="t">PID feedback loop</text><rect x="60" y="140" rx="14" ry="14" width="190" height="100" class="accent"/><text x="155.0" y="180" text-anchor="middle" class="s">目标</text><text x="155.0" y="210" text-anchor="middle" class="m">setpoint</text><path d="M 250 190 L 335 190" class="arrow"/><rect x="335" y="140" rx="14" ry="14" width="200" height="100" class="box"/><text x="435.0" y="180" text-anchor="middle" class="s">比较</text><text x="435.0" y="210" text-anchor="middle" class="m">得到误差 e</text><path d="M 535 190 L 620 190" class="arrow"/><rect x="620" y="140" rx="14" ry="14" width="220" height="100" class="accent2"/><text x="730.0" y="180" text-anchor="middle" class="s">PID 控制器</text><text x="730.0" y="210" text-anchor="middle" class="m">计算控制量 u</text><path d="M 840 190 L 925 190" class="arrow"/><rect x="925" y="140" rx="14" ry="14" width="210" height="100" class="accent"/><text x="1030.0" y="180" text-anchor="middle" class="s">电机 / 对象</text><text x="1030.0" y="210" text-anchor="middle" class="m">产生实际速度</text><path d="M 1030 240 L 1030 330 L 435 330 L 435 246" class="arrow"/><text x="700" y="360" text-anchor="middle" class="m">传感器把实际结果送回比较点：这一步把开环变成闭环</text></svg>
