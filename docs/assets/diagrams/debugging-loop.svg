<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Debugging is a closed loop">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.s{font-size:20px;font-weight:600}.m{font-size:15px;fill:#5f6b7a}.box{fill:#f4f7fb;stroke:#8aa0b5;stroke-width:2}.a{fill:#dce8f5;stroke:#8aa0b5;stroke-width:2}.g{fill:#e8f1e8;stroke:#8aa0b5;stroke-width:2}.w{fill:#f7eee1;stroke:#8aa0b5;stroke-width:2}.arrow{stroke:#8aa0b5;stroke-width:3;fill:none;marker-end:url(#arr)}</style>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b5"/></marker></defs>
<text x="60" y="58" class="t">Debugging is a closed loop</text>
<rect x="60.0" y="135" rx="16" ry="16" width="193.6" height="145" class="a"/>
<text x="156.8" y="183" text-anchor="middle" class="s">Reproduce</text>
<text x="156.8" y="217" text-anchor="middle" class="m">fixed input</text>
<path d="M 253.6 207.5 L 275.6 207.5" class="arrow"/>
<rect x="281.6" y="135" rx="16" ry="16" width="193.6" height="145" class="box"/>
<text x="378.4" y="183" text-anchor="middle" class="s">Observe</text>
<text x="378.4" y="217" text-anchor="middle" class="m">logs + metrics</text>
<path d="M 475.2 207.5 L 497.2 207.5" class="arrow"/>
<rect x="503.2" y="135" rx="16" ry="16" width="193.6" height="145" class="w"/>
<text x="600.0" y="183" text-anchor="middle" class="s">Hypothesis</text>
<text x="600.0" y="217" text-anchor="middle" class="m">one cause</text>
<path d="M 696.8 207.5 L 718.8 207.5" class="arrow"/>
<rect x="724.8" y="135" rx="16" ry="16" width="193.6" height="145" class="g"/>
<text x="821.6" y="183" text-anchor="middle" class="s">Verify</text>
<text x="821.6" y="217" text-anchor="middle" class="m">small test</text>
<path d="M 918.4 207.5 L 940.4 207.5" class="arrow"/>
<rect x="946.4" y="135" rx="16" ry="16" width="193.6" height="145" class="a"/>
<text x="1043.2" y="183" text-anchor="middle" class="s">Regression</text>
<text x="1043.2" y="217" text-anchor="middle" class="m">keep evidence</text>
</svg>