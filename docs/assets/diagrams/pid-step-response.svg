<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="PID step response: who dominates when?"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Inter,Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.s{font-size:20px;font-weight:650}.b{font-size:17px}.m{font-size:15px;fill:#5f6b7a}.box{fill:#f4f7fb;stroke:#8aa0b5;stroke-width:2}.accent{fill:#dce8f5;stroke:#8aa0b5;stroke-width:2}.accent2{fill:#e8f1e8;stroke:#8aa0b5;stroke-width:2}.warn{fill:#f7eee1;stroke:#8aa0b5;stroke-width:2}.line{stroke:#8aa0b5;stroke-width:3;fill:none}.arrow{stroke:#8aa0b5;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#8aa0b5;stroke-width:2;stroke-dasharray:8 7;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b5"/></marker></defs><text x="60" y="58" class="t">PID step response: who dominates when?</text><line x1="100" y1="320" x2="1120" y2="320" class="line"/><line x1="100" y1="100" x2="100" y2="320" class="line"/><path d="M 100 160 L 1120 160" class="dash"/><text x="1115" y="145" text-anchor="end" class="m">目标值</text><polyline points="100,310 180,270 260,205 340,145 410,118 480,145 560,178 650,168 760,158 880,160 1000,160 1120,160" fill="none" stroke="#607d96" stroke-width="5"/><circle cx="185" cy="365" r="20" class="accent"/><text x="185" y="372" text-anchor="middle" class="b">①</text><text x="185" y="400" text-anchor="middle" class="m">起步：P 主导</text><circle cx="365" cy="365" r="20" class="accent"/><text x="365" y="372" text-anchor="middle" class="b">②</text><text x="365" y="400" text-anchor="middle" class="m">接近：I 累积</text><circle cx="535" cy="365" r="20" class="accent"/><text x="535" y="372" text-anchor="middle" class="b">③</text><text x="535" y="400" text-anchor="middle" class="m">越过：反向修正</text><circle cx="890" cy="365" r="20" class="accent"/><text x="890" y="372" text-anchor="middle" class="b">④</text><text x="890" y="400" text-anchor="middle" class="m">稳态：I 维持</text><text x="1120" y="345" text-anchor="end" class="m">t</text><text x="72" y="118" text-anchor="middle" class="m" transform="rotate(-90 72 118)">输出</text></svg>
