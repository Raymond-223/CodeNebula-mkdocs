<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Spectral radius and convergence"><rect width="900" height="430" fill="#fff"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.b{font-size:19px}.axis{stroke:#64748b;stroke-width:2}.unit{fill:#e0f2fe;stroke:#0891b2;stroke-width:3}.in{fill:#16a34a}.out{fill:#dc2626}.arrow{stroke:#4f46e5;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f46e5"/></marker></defs><text x="35" y="45" class="t">Eigenvalues inside the unit circle</text><line x1="80" y1="225" x2="520" y2="225" class="axis"/><line x1="300" y1="70" x2="300" y2="380" class="axis"/><circle cx="300" cy="225" r="125" class="unit"/><circle cx="355" cy="180" r="9" class="in"/><circle cx="230" cy="265" r="9" class="in"/><circle cx="455" cy="125" r="9" class="out"/><text x="550" y="155" class="b">ρ(B) &lt; 1 ⇒ Bᵏ → 0</text><text x="550" y="205" class="b">不保证每一步范数缩小</text><path d="M570 275 C650 210 735 330 825 235" fill="none" class="arrow"/><text x="575" y="325" class="b">可能先放大，再衰减</text></svg>
