<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Optimization with constraints"><rect width="1200" height="500" fill="#fff"/><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.s{font-size:20px;font-weight:600}.m{font-size:16px;fill:#5f6b7a}.box{fill:#f4f7fb;stroke:#8aa0b5;stroke-width:2}.a{fill:#e8f1e8;stroke:#8aa0b5;stroke-width:2}.arr{stroke:#8aa0b5;stroke-width:3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b5"/></marker></defs><text x="60" y="58" class="t">Optimization with constraints</text><rect x="70" y="135" width="270" height="170" rx="16" class="box"/><text x="205" y="190" text-anchor="middle" class="s">Objective f(x)</text><text x="205" y="230" text-anchor="middle" class="m">what should be improved?</text><rect x="465" y="135" width="270" height="170" rx="16" class="box"/><text x="600" y="190" text-anchor="middle" class="s">Feasible set</text><text x="600" y="230" text-anchor="middle" class="m">what is allowed?</text><rect x="860" y="135" width="270" height="170" rx="16" class="a"/><text x="995" y="190" text-anchor="middle" class="s">Solution x*</text><text x="995" y="230" text-anchor="middle" class="m">best feasible choice</text><path d="M340 220 L455 220" class="arr"/><path d="M735 220 L850 220" class="arr"/><text x="600" y="380" text-anchor="middle" class="s">Optimization = objective + variables + constraints</text></svg>