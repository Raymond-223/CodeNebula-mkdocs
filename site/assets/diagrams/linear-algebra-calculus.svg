<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Linear algebra and calculus bridge">
<rect width="1200" height="470" fill="#ffffff"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.s{font-size:20px;font-weight:600}.m{font-size:16px;fill:#5f6b7a}.b{fill:#f4f7fb;stroke:#8aa0b5;stroke-width:2}.a{fill:#dce8f5;stroke:#8aa0b5;stroke-width:2}.arr{stroke:#8aa0b5;stroke-width:3;fill:none;marker-end:url(#x)}</style>
<defs><marker id="x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b5"/></marker></defs>
<text x="60" y="58" class="t">Linear algebra + calculus: the bridge to intelligent systems</text>
<rect x="55" y="145" width="190" height="145" rx="16" class="b"/><text x="150" y="195" text-anchor="middle" class="s">Vector x</text><text x="150" y="230" text-anchor="middle" class="m">state / feature</text>
<rect x="285" y="145" width="190" height="145" rx="16" class="a"/><text x="380" y="195" text-anchor="middle" class="s">Matrix A</text><text x="380" y="230" text-anchor="middle" class="m">transform / model</text>
<rect x="515" y="145" width="190" height="145" rx="16" class="b"/><text x="610" y="195" text-anchor="middle" class="s">Output y</text><text x="610" y="230" text-anchor="middle" class="m">prediction / state</text>
<rect x="745" y="145" width="190" height="145" rx="16" class="a"/><text x="840" y="195" text-anchor="middle" class="s">Loss J</text><text x="840" y="230" text-anchor="middle" class="m">scalar objective</text>
<rect x="975" y="145" width="170" height="145" rx="16" class="b"/><text x="1060" y="195" text-anchor="middle" class="s">Gradient ∇J</text><text x="1060" y="230" text-anchor="middle" class="m">update direction</text>
<path d="M245 217 L275 217" class="arr"/><path d="M475 217 L505 217" class="arr"/><path d="M705 217 L735 217" class="arr"/><path d="M935 217 L965 217" class="arr"/>
<text x="600" y="375" text-anchor="middle" class="s">Represent → transform → evaluate → differentiate → update</text>
