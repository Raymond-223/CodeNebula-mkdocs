<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Central Limit Theorem: shape changes after summation"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Inter,Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.s{font-size:20px;font-weight:650}.b{font-size:17px}.m{font-size:15px;fill:#5f6b7a}.box{fill:#f4f7fb;stroke:#8aa0b5;stroke-width:2}.accent{fill:#dce8f5;stroke:#8aa0b5;stroke-width:2}.accent2{fill:#e8f1e8;stroke:#8aa0b5;stroke-width:2}.warn{fill:#f7eee1;stroke:#8aa0b5;stroke-width:2}.line{stroke:#8aa0b5;stroke-width:3;fill:none}.arrow{stroke:#8aa0b5;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#8aa0b5;stroke-width:2;stroke-dasharray:8 7;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b5"/></marker></defs><text x="60" y="58" class="t">Central Limit Theorem: shape changes after summation</text><text x="330" y="105" text-anchor="middle" class="s">n = 1</text><text x="870" y="105" text-anchor="middle" class="s">n = 30</text><rect x="100" y="205" width="26" height="95" class="accent"/><rect x="135" y="220" width="26" height="80" class="accent"/><rect x="170" y="235" width="26" height="65" class="accent"/><rect x="205" y="247" width="26" height="53" class="accent"/><rect x="240" y="257" width="26" height="43" class="accent"/><rect x="275" y="266" width="26" height="34" class="accent"/><rect x="310" y="273" width="26" height="27" class="accent"/><rect x="345" y="279" width="26" height="21" class="accent"/><rect x="380" y="284" width="26" height="16" class="accent"/><rect x="415" y="288" width="26" height="12" class="accent"/><rect x="450" y="291" width="26" height="9" class="accent"/><rect x="485" y="293" width="26" height="7" class="accent"/><rect x="650" y="292" width="26" height="8" class="accent2"/><rect x="685" y="284" width="26" height="16" class="accent2"/><rect x="720" y="270" width="26" height="30" class="accent2"/><rect x="755" y="248" width="26" height="52" class="accent2"/><rect x="790" y="222" width="26" height="78" class="accent2"/><rect x="825" y="197" width="26" height="103" class="accent2"/><rect x="860" y="182" width="26" height="118" class="accent2"/><rect x="895" y="197" width="26" height="103" class="accent2"/><rect x="930" y="222" width="26" height="78" class="accent2"/><rect x="965" y="248" width="26" height="52" class="accent2"/><rect x="1000" y="270" width="26" height="30" class="accent2"/><rect x="1035" y="284" width="26" height="16" class="accent2"/><rect x="1070" y="292" width="26" height="8" class="accent2"/><line x1="80" y1="300" x2="540" y2="300" class="line"/><line x1="630" y1="300" x2="1130" y2="300" class="line"/><text x="330" y="338" text-anchor="middle" class="m">单次指数样本：明显右偏</text><text x="870" y="338" text-anchor="middle" class="m">30 次求和标准化：接近钟形</text><text x="600" y="390" text-anchor="middle" class="b">独立变量求和后，标准化分布逐渐接近高斯形状</text></svg>
