<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Bayesian update"><rect width="1200" height="500" fill="#fff"/><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.s{font-size:20px;font-weight:600}.m{font-size:16px;fill:#5f6b7a}.b{fill:#f4f7fb;stroke:#8aa0b5;stroke-width:2}.a{fill:#dce8f5;stroke:#8aa0b5;stroke-width:2}.arr{stroke:#8aa0b5;stroke-width:3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b5"/></marker></defs><text x="60" y="58" class="t">Bayesian update</text><rect x="70" y="150" width="250" height="150" rx="16" class="b"/><text x="195" y="205" text-anchor="middle" class="s">Prior</text><text x="195" y="240" text-anchor="middle" class="m">belief before evidence</text><rect x="475" y="150" width="250" height="150" rx="16" class="b"/><text x="600" y="205" text-anchor="middle" class="s">Likelihood</text><text x="600" y="240" text-anchor="middle" class="m">evidence model</text><rect x="880" y="150" width="250" height="150" rx="16" class="a"/><text x="1005" y="205" text-anchor="middle" class="s">Posterior</text><text x="1005" y="240" text-anchor="middle" class="m">updated belief</text><path d="M320 225 L465 225" class="arr"/><path d="M725 225 L870 225" class="arr"/><text x="600" y="380" text-anchor="middle" class="s">posterior ∝ likelihood × prior</text></svg>