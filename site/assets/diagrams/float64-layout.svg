<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="How float64 stores a number"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Inter,Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.s{font-size:20px;font-weight:650}.b{font-size:17px}.m{font-size:15px;fill:#5f6b7a}.box{fill:#f4f7fb;stroke:#8aa0b5;stroke-width:2}.accent{fill:#dce8f5;stroke:#8aa0b5;stroke-width:2}.accent2{fill:#e8f1e8;stroke:#8aa0b5;stroke-width:2}.warn{fill:#f7eee1;stroke:#8aa0b5;stroke-width:2}.line{stroke:#8aa0b5;stroke-width:3;fill:none}.arrow{stroke:#8aa0b5;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#8aa0b5;stroke-width:2;stroke-dasharray:8 7;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b5"/></marker></defs><text x="60" y="58" class="t">How float64 stores a number</text><text x="70" y="105" class="b">IEEE 754 float64 = 64 bit</text><rect x="70" y="145" width="70" height="100" class="warn"/><text x="105.0" y="190" text-anchor="middle" class="s">1 bit</text><text x="105.0" y="219" text-anchor="middle" class="m">符号</text><rect x="140" y="145" width="260" height="100" class="accent"/><text x="270.0" y="190" text-anchor="middle" class="s">11 bit</text><text x="270.0" y="219" text-anchor="middle" class="m">指数</text><rect x="400" y="145" width="730" height="100" class="accent2"/><text x="765.0" y="190" text-anchor="middle" class="s">52 bit</text><text x="765.0" y="219" text-anchor="middle" class="m">尾数 fraction</text><text x="70" y="300" class="b">有效精度：52 个显式尾数位 + 1 个隐含首位 ≈ 53 bit ≈ 15–16 位十进制有效数字</text></svg>
