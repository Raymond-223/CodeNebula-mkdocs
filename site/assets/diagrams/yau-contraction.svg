<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-label="Contraction mapping shrinks distances"><rect width="900" height="410" fill="#fff"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.b{font-size:20px}.set{fill:#eef2ff;stroke:#6366f1;stroke-width:3}.p{fill:#db2777}.line{stroke:#db2777;stroke-width:4}.arr{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style><defs><marker markerUnits="userSpaceOnUse" id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><text x="40" y="48" class="t">d(g(x), g(y)) ≤ q d(x, y), q &lt; 1</text><ellipse cx="225" cy="230" rx="155" ry="115" class="set"/><ellipse cx="700" cy="230" rx="125" ry="88" class="set"/><circle cx="150" cy="230" r="9" class="p"/><circle cx="305" cy="230" r="9" class="p"/><line x1="150" y1="230" x2="305" y2="230" class="line"/><circle cx="670" cy="230" r="9" class="p"/><circle cx="730" cy="230" r="9" class="p"/><line x1="670" y1="230" x2="730" y2="230" class="line"/><line x1="395" y1="230" x2="545" y2="230" class="arr"/><text x="458" y="205" class="b">g</text><text x="132" y="275" class="b">d(x,y)</text><text x="640" y="275" class="b">≤ q d(x,y)</text></svg>
