<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Mathematics minimum sufficient path">
  <rect width="1200" height="430" fill="#ffffff"/>
  <style>
    text{font-family:Inter,Arial,sans-serif;fill:#172033}
    .t{font-size:30px;font-weight:700}.s{font-size:18px;font-weight:600}.m{font-size:14px;fill:#5f6b7a}.m-fit{font-size:12px;fill:#5f6b7a}
    .box{fill:#f4f7fb;stroke:#8aa0b5;stroke-width:2}.accent{fill:#dce8f5;stroke:#8aa0b5;stroke-width:2}
    .arrow{stroke:#8aa0b5;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b5"/></marker></defs>
  <text x="60" y="58" class="t">Mathematics: minimum sufficient path</text>
  <rect x="60" y="130" rx="16" width="156.667" height="150" class="accent"/><text x="138.333" y="185" text-anchor="middle" class="s">Linear algebra</text><text x="138.333" y="218" text-anchor="middle" class="m">vectors / matrices</text>
  <path d="M216.667 205 L238.667 205" class="arrow"/>
  <rect x="244.667" y="130" rx="16" width="156.667" height="150" class="box"/><text x="323" y="185" text-anchor="middle" class="s">Probability</text><text x="323" y="218" text-anchor="middle" class="m">random variables</text>
  <path d="M401.334 205 L423.334 205" class="arrow"/>
  <rect x="429.334" y="130" rx="16" width="156.667" height="150" class="accent"/><text x="507.667" y="185" text-anchor="middle" class="s">Bayes</text><text x="507.667" y="218" text-anchor="middle" class="m">conditioning</text>
  <path d="M586.001 205 L608.001 205" class="arrow"/>
  <rect x="614" y="130" rx="16" width="156.667" height="150" class="box"/><text x="692.333" y="185" text-anchor="middle" class="s">Markov</text><text x="692.333" y="218" text-anchor="middle" class="m">state evolution</text>
  <path d="M770.667 205 L792.667 205" class="arrow"/>
  <rect x="798.667" y="130" rx="16" width="156.667" height="150" class="accent"/><text x="877" y="185" text-anchor="middle" class="s">Optimization</text><text x="877" y="218" text-anchor="middle" class="m-fit">objectives / constraints</text>
  <path d="M955.334 205 L977.334 205" class="arrow"/>
  <rect x="983.333" y="130" rx="16" width="156.667" height="150" class="box"/><text x="1061.667" y="185" text-anchor="middle" class="s">Uncertainty</text><text x="1061.667" y="218" text-anchor="middle" class="m">stochastic / robust</text>
</svg>
